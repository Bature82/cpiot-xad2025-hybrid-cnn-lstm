[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cpiot-xad"
version = "1.0.0"
description = "CPIoT-XAD2025: hybrid CNN/LSTM cross-domain anomaly detection for cyber-physical IoT"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Muhammad Inuwa" }]
keywords = ["anomaly-detection", "cyber-physical-systems", "iot",
            "intrusion-detection", "cnn", "lstm", "swat", "n-baiot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tensorflow>=2.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cpiot-xad = "cpiot_xad.cli:main"

[tool.setuptools.packages.find]
include = ["cpiot_xad*"]
